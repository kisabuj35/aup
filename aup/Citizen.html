<!-- 🟢 JAVASCRIPT LOGIC -->
<script>
  // 🟢 স্থায়ী ও নিরাপদ স্ট্যাটিক ভেক্টর লোগো
  const STATIC_GOVT_LOGO = "https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg";
  const STATIC_UP_LOGO = "https://lh3.googleusercontent.com/d/1_LMOoAtirVZeGxE4sz_CVQtQpInPPQTs";

  function toBn(n) {
    if (n === null || n === undefined || n === '') return '';
    return (n + '').replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
  }

  function formatSerial3Digits(val) {
    if (!val) return '০০১';
    let numOnly = String(val).replace(/[^0-9]/g, '');
    if (!numOnly) return '০০১';
    let padded = numOnly.padStart(3, '0');
    return toBn(padded);
  }

  function toggleCitizenSpouse(val) {
    var div = document.getElementById('dCitSpouseDiv');
    if(val === 'বিবাহিত') div.classList.remove('d-none');
    else { div.classList.add('d-none'); document.getElementById('dCitSpouse').value = ''; }
  }

  function toggleEditSpouse(val) {
    var div = document.getElementById('edCitSpouseDiv');
    if(val === 'বিবাহিত') div.style.display = 'block';
    else { div.style.display = 'none'; document.getElementById('edCitSpouse').value = ''; }
  }

  // 🟢 মাল্টি-লেয়ার স্মার্ট ডেটা ফেচার (যা কোনো অবস্থাতেই ফেইল হবে না)
  async function getCitizenRecord(appId) {
    let data = null;
    try {
      if (typeof callBackendAPI === 'function') {
        data = await callBackendAPI('getCitizenshipDetails', appId);
        if (!data || data.found === false || data.error) {
          data = await callBackendAPI('trackApplication', appId);
        }
      }
    } catch(e) { console.warn("API Error:", e); }

    // যদি এপিআই ডেটা না পায়, তবে এডমিন প্যানেলের ক্যাশ মেমোরি থেকে খুঁজবে
    if ((!data || data.found === false) && typeof rawDataStore !== 'undefined' && rawDataStore.cit) {
      let foundInCache = rawDataStore.cit.find(x => String(x.appId).trim() === String(appId).trim() || String(x.id).trim() === String(appId).trim());
      if (foundInCache) data = foundInCache;
    }

    return (data && data.data) ? data.data : data;
  }

  async function submitDedicatedCitizen() {
    var btn = document.getElementById('dCitSubmitBtn');
    btn.disabled = true; btn.innerText = 'জমা হচ্ছে...';

    var mStatus = document.getElementById('dCitMarital').value;
    var spouseVal = mStatus === 'বিবাহিত' ? document.getElementById('dCitSpouse').value.trim() : '';

    var formData = {
      type: 'নাগরিকত্ব সনদ',
      name: document.getElementById('dCitName').value.trim(),
      nid: document.getElementById('dCitNid').value.trim(),
      fatherName: document.getElementById('dCitFather').value.trim(),
      motherName: document.getElementById('dCitMother').value.trim(),
      dob: document.getElementById('dCitDob').value,
      maritalStatus: mStatus,
      spouseName: spouseVal,
      mobile: document.getElementById('dCitMobile').value.trim(),
      wardNo: document.getElementById('dCitWard').value,
      village: document.getElementById('dCitVillage').value.trim(),
      postOffice: document.getElementById('dCitPost').value.trim(),
      division: 'বরিশাল'
    };

    const res = await callBackendAPI('submitCitizenshipDirect', formData);
    btn.disabled = false; btn.innerText = 'আবেদন জমা দিন';

    if(res && res.success) {
      document.getElementById('dedicatedCitizenForm').reset();
      toggleCitizenSpouse('অবিবাহিত');
      document.getElementById('citSuccessAppId').innerText = res.appId;
      document.getElementById('copyToast').style.display = 'none';
      bootstrap.Modal.getOrCreateInstance(document.getElementById('citSuccessModal')).show();
    } else { 
      Swal.fire({ icon: 'error', title: 'আবেদন ব্যর্থ', text: res ? res.error : 'আবেদন জমা দেওয়া যায়নি।' });
    }
  }

  function copyCitTracking() {
    var code = document.getElementById('citSuccessAppId').innerText;
    navigator.clipboard.writeText(code);
    var toast = document.getElementById('copyToast');
    toast.style.display = 'inline-block';

            outline: 2px dashed #d32f2f !important; outline-offset: 4px !important;

          }
          .cit-watermark-bg { position: absolute !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: 440px !important; opacity: 0.10 !important; z-index: 1 !important; }
          .cit-content-body { position: relative !important; z-index: 2 !important; height: 100% !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; }
          .cit-3d-ribbon-wrapper { text-align: center !important; margin: 8px 0 12px 0 !important; position: relative !important; }
          .cit-3d-ribbon-box {
            position: relative !important; display: inline-block !important;

      <body>${rawHtml}</body>
      </html>
    `);
    printDoc.close();

    var images = printDoc.getElementsByTagName('img');
    var total = images.length, loaded = 0, printed = false;
    function triggerPrint() {
      if (!printed) {
        printed = true;

        };
      }
      setTimeout(triggerPrint, 500);
    }

    document.getElementById('edCitVillage').value = data.village || '';
    document.getElementById('edCitPost').value = data.postOffice || 'আউলিয়াপুর ময়দান-৮৬০০';
    document.getElementById('edCitCertNo').value = data.certNo || '';

    var mStatus = data.maritalStatus || 'অবিবাহিত';
    document.getElementById('edCitMarital').value = mStatus;
    if(mStatus === 'বিবাহিত') {
      document.getElementById('edCitSpouseDiv').style.display = 'block';
      document.getElementById('edCitSpouse').value = data.spouseName || '';
    } else {
      document.getElementById('edCitSpouseDiv').style.display = 'none';
      document.getElementById('edCitSpouse').value = '';
    }

    if(data.signatoryRole === 'প্যানেল চেয়ারম্যান') document.getElementById('edSigPanel').checked = true;
    else if(data.signatoryRole === 'ভারপ্রাপ্ত চেয়ারম্যান') document.getElementById('edSigActing').checked = true;
    else document.getElementById('edSigChair').checked = true;

    bootstrap.Modal.getOrCreateInstance(document.getElementById('editCitizenModal')).show();
  }

  // 🟢 সংশোধিত তথ্য ব্যাকএন্ডে সংরক্ষণ (Save) করা
  async function saveEditedCitizenData() {
    var btn = document.getElementById('saveEditCitBtn');
    btn.disabled = true; btn.innerText = 'সংরক্ষণ হচ্ছে...';

    var sigVal = 'চেয়ারম্যান';
    if(document.getElementById('edSigPanel').checked) sigVal = 'প্যানেল চেয়ারম্যান';
    if(document.getElementById('edSigActing').checked) sigVal = 'ভারপ্রাপ্ত চেয়ারম্যান';

    var mStatus = document.getElementById('edCitMarital').value;
    var spouseVal = (mStatus === 'বিবাহিত') ? document.getElementById('edCitSpouse').value.trim() : '';

    var payload = {
      appId: document.getElementById('edCitAppId').value,
      name: document.getElementById('edCitName').value.trim(),
      nid: document.getElementById('edCitNid').value.trim(),
      fatherName: document.getElementById('edCitFather').value.trim(),
      motherName: document.getElementById('edCitMother').value.trim(),
      dob: document.getElementById('edCitDob').value,
      maritalStatus: mStatus,
      spouseName: spouseVal,
      mobile: document.getElementById('edCitMobile').value.trim(),
      wardNo: document.getElementById('edCitWard').value,
      village: document.getElementById('edCitVillage').value.trim(),
      postOffice: document.getElementById('edCitPost').value.trim(),
      certNo: document.getElementById('edCitCertNo').value.trim(),
      signatoryRole: sigVal
    };

    const res = await callBackendAPI('saveEditedApplication', payload);
    btn.disabled = false; btn.innerText = 'সংরক্ষণ করুন';

    if(res && res.success) {
      bootstrap.Modal.getInstance(document.getElementById('editCitizenModal')).hide();
      if(typeof loadCitizenshipApps === 'function') loadCitizenshipApps();
      Swal.fire({
        icon: 'success',
        title: 'সংশোধিত হয়েছে!',
        text: 'নাগরিকত্ব সনদের সকল তথ্য সফলভাবে আপডেট হয়েছে।',
        timer: 1800,
        showConfirmButton: false
      });
    } else {
      Swal.fire({ icon: 'error', title: 'ব্যর্থ!', text: 'তথ্য আপডেট করা সম্ভব হয়নি।' });
    }
  }
</script>
