  'পুনঃ বিবাহ না হওয়া সনদ':'তাঁহার পূর্বের স্বামী/স্ত্রীর মৃত্যুর পর অদ্যাবধি তিনি দ্বিতীয় কোনো বিবাহ বন্ধনে আবদ্ধ হন নাই। তিনি বর্তমানে সম্পূর্ণ নিঃসঙ্গ ও বিধবা/বিপত্মীক জীবন যাপন করিতেছেন এবং অদ্যাবধি দ্বিতীয় কোনো বিবাহ করেন নাই মর্মে প্রত্যয়ন করা হইল।',

  'আর্থিক অসচ্ছলতার সনদ':'তাঁহার পরিবারের সার্বিক আর্থিক অবস্থা অত্যন্ত নাজুক, অসচ্ছল ও দারিদ্র্যসীমার নিচে। পরিবার পরিচালনায় তিনি চরম আর্থিক দৈন্যদশায় আছেন। তিনি যেকোনো সরকারি, আধা-সরকারি ও বেসরকারি আর্থিক সহায়তা, অনুদান এবং বিশেষ সাহায্য পাওয়ার সম্পূর্ণ উপযুক্ত ও হকদার।',
  'আর্থিক অসচ্ছলতার সনদপত্র':'তাঁহার পরিবারের সার্বিক আর্থিক অবস্থা অত্যন্ত নাজুক, অসচ্ছল ও দারিদ্র্যসীমার নিচে। পরিবার পরিচালনায় তিনি চরম আর্থিক দৈন্যদশায় আছেন। তিনি যেকোনো সরকারি, আধা-সরকারি ও বেসরকারি আর্থিক সহায়তা, অনুদান এবং বিশেষ সাহায্য পাওয়ার সম্পূর্ণ উপযুক্ত ও হকদার।',
  'প্রতিবন্ধী সনদপত্র':'তিনি শারীরিক/মানসিক প্রতিবন্ধকতায় ভুগিতেছেন এবং স্বাভাবিক কাজকর্ম ও জীবিকা পরিচালনায় অক্ষম। তিনি সমাজসেবা অধিদপ্তর এবং সরকারের সামাজিক নিরাপত্তা কর্মসূচির আওতায় প্রতিবন্ধী ভাতা ও অন্যান্য সুযোগ-সুবিধা পাওয়ার পূর্ণ যোগ্য।',
  'অনাপত্তি সনদপত্র':'তাঁহার নতুন পাসপোর্ট গ্রহণ, সরকারি/বেসরকারি চাকুরিতে যোগদান, উচ্চশিক্ষা অর্জন কিংবা বিদেশ গমনাগমনের ক্ষেত্রে অত্র ইউনিয়ন পরিষদ কার্যালয়ের পক্ষ হইতে কোনো প্রকার আপত্তি বা বাধা নাই।',
  'নতুন ভোটারের প্রত্যয়ন':'তাঁহার বয়স ১৮ (আঠারো) বছর পূর্ণ হইয়াছে এবং তিনি অত্র এলাকার একজন স্থায়ী অধিবাসী। তিনি বাংলাদেশ নির্বাচন কমিশনের ভোটার তালিকায় নতুন ভোটার হিসেবে নাম অন্তর্ভুক্তির জন্য সর্বতোভাবে উপযুক্ত।',
  'নতুন ভোটারের প্রত্যয়ন পত্র':'তাঁহার বয়স ১৮ (আঠারো) বছর পূর্ণ হইয়াছে এবং তিনি অত্র এলাকার একজন স্থায়ী অধিবাসী। তিনি বাংলাদেশ নির্বাচন কমিশনের ভোটার তালিকায় নতুন ভোটার হিসেবে নাম অন্তর্ভুক্তির জন্য সর্বতোভাবে উপযুক্ত।',
  'ভোটার স্থানান্তরের প্রত্যয়ন':'তিনি স্থায়ীভাবে অত্র ইউনিয়নে বসবাস করিতে থাকায় তাঁহার পূর্বের নির্বাচনী এলাকা হইতে অত্র ইউনিয়ন পরিষদ এলাকার ভোটার তালিকায় নাম স্থানান্তর করার বিষয়ে অত্র কার্যালয়ের কোনো প্রকার আপত্তি বা বাধা নাই।',
  'ভোটার স্থানান্তরের প্রত্যয়ন পত্র':'তিনি স্থায়ীভাবে অত্র ইউনিয়নে বসবাস করিতে থাকায় তাঁহার পূর্বের নির্বাচনী এলাকা হইতে অত্র ইউনিয়ন পরিষদ এলাকার ভোটার তালিকায় নাম স্থানান্তর করার বিষয়ে অত্র কার্যালয়ের কোনো প্রকার আপত্তি বা বাধা নাই।',
  'বেকারত্বের সনদপত্র':'তিনি শিক্ষাজীবন সমাপ্ত করিয়া বর্তমানে কোনো প্রকার সরকারি, আধাসরকারি বা বেসরকারি চাকুরিতে নিয়োজিত নাই। তিনি একজন প্রকৃত বেকার যুবক/যুবতী এবং কর্মসংস্থানের জন্য সচেষ্ট আছেন।',
  'অস্থায়ী বসবাসের প্রত্যয়ন':'তিনি জীবিকা নির্বাহ, চাকুরি বা ব্যবসা পরিচালনার উদ্দেশ্যে অত্র ইউনিয়ন পরিষদ এলাকার উক্ত ঠিকানায় অস্থায়ীভাবে বসবাস করিতেছেন। আমার জানামতে তিনি কোনো প্রকার অসামাজিক বা রাষ্ট্রবিরোধী কার্যকলাপে জড়িত নন।',
  'অস্থায়ীভাবে বসবাসের প্রত্যয়ন পত্র':'তিনি জীবিকা নির্বাহ, চাকুরি বা ব্যবসা পরিচালনার উদ্দেশ্যে অত্র ইউনিয়ন পরিষদ এলাকার উক্ত ঠিকানায় অস্থায়ীভাবে বসবাস করিতেছেন। আমার জানামতে তিনি কোনো প্রকার অসামাজিক বা রাষ্ট্রবিরোধী কার্যকলাপে জড়িত নন।',
  'জাতীয়তা সনদ':'তিনি জন্মসূত্রে ও বংশানুক্রমিকভাবে বাংলাদেশের একজন গর্বিত ও স্থায়ী নাগরিক। তিনি অদ্যাবধি কোনো বিদেশি রাষ্ট্রের নাগরিকত্ব গ্রহণ করেন নাই এবং তিনি বাংলাদেশ রাষ্ট্রের প্রতি সম্পূর্ণ অনুগত।',
  'স্থায়ী বাসিন্দা সনদ':'তিনি এবং তাঁহার পূর্বপুরুষগণ বংশানুক্রমিকভাবে অত্র ইউনিয়ন পরিষদের উক্ত ওয়ার্ডের স্থায়ী অধিবাসী এবং তিনি এলাকার যাবতীয় নাগরিক অধিকার ও সাংবিধানিক সুযোগ-সুবিধা ভোগ করিয়া আসিতেছেন।',
  'এতিম সনদ':'শৈশবাবস্থাতেই তাঁহার জন্মদাতা পিতা মৃত্যুবরণ করিয়াছেন এবং বর্তমানে তিনি একজন অসহায় ও পিতৃহীন এতিম সন্তান। তিনি সরকার ও বিভিন্ন দাতব্য সংস্থার এতিম ভাতা ও সাহায্য পাওয়ার সম্পূর্ণ যোগ্য।',
  'একই নামের প্রত্যয়ন':'বিভিন্ন জাতীয় পরিচয়পত্র, জন্ম নিবন্ধন, শিক্ষা সনদ ও জমির দলিলে তাঁহার নামের বানানে আংশিক অমিল বা ভিন্নতা পরিলক্ষিত হইলেও প্রকৃতপক্ষে সকল নথিতে উল্লিখিত নামধারী ব্যক্তি একই ও অভিন্ন ব্যক্তি।',
  'দ্বিতীয় বিবাহের অনুমতি':'পারিবারিক বিশেষ পরিস্থিতি ও ধর্মীয় ও মুসলিম পারিবারিক আইন অধ্যাদেশ মোতাবেক যাবতীয় শর্ত পূরণ সাপেক্ষে তাঁহার দ্বিতীয় বিবাহে অত্র ইউনিয়ন পরিষদ কার্যালয়ের পক্ষ হইতে কোনো প্রকার আপত্তি নাই।',
  'দ্বিতীয় বিবাহের অনুমতি পত্র':'পারিবারিক বিশেষ পরিস্থিতি ও ধর্মীয় ও মুসলিম পারিবারিক আইন অধ্যাদেশ মোতাবেক যাবতীয় শর্ত পূরণ সাপেক্ষে তাঁহার দ্বিতীয় বিবাহে অত্র ইউনিয়ন পরিষদ কার্যালয়ের পক্ষ হইতে কোনো প্রকার আপত্তি নাই।',
  'পারিবারিক সনদ':'আমার জানামতে তিনি অত্র ইউনিয়ন পরিষদের একজন স্থায়ী বাসিন্দা এবং তাঁহার পরিবারের সকল সদস্যগণের মধ্যে সুসম্পর্ক বিদ্যমান রহিয়াছে।',
  'বিবিধ প্রত্যয়নপত্র':'তিনি অত্র এলাকার একজন সুপরিচিত, সৎ, শান্তিপ্রিয় ও আইনানুগ নাগরিক। আমার জানামতে তিনি কোনো প্রকার সমাজবিরোধী, রাষ্ট্রদ্রোহী বা অনৈতিক কর্মকাণ্ডে জড়িত নন।'
};

function escapeGeneral(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function generalBnDigits(v){return String(v==null?'':v).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
function generalApplicationNumber(appId){var value=String(appId==null?'':appId).replace(/^AUL[-/\s]*/i,'');var parts=value.split(/[-/\s]+/).filter(function(part){return part!==''});return generalBnDigits(parts.length?parts[parts.length-1]:value)}
function generalCurrentYear(){return generalBnDigits(new Date().getFullYear())}
function generalPrintDate(){return new Date().toLocaleDateString('bn-BD',{day:'2-digit',month:'2-digit',year:'numeric'})}
function openGeneralServicePage(type){navToSection('generalServiceView');document.getElementById('generalAppPageForm').reset();document.getElementById('genTypeHidden').value=type;document.getElementById('genServiceLabel').innerText=type;document.getElementById('genPageMainTitle').innerText=type+' আবেদন';document.getElementById('genPost').value='আউলিয়াপুর ময়দান'}
function submitGeneralAppForm(){var b=document.getElementById('genSubmitBtn');b.disabled=true;var d={type:document.getElementById('genTypeHidden').value,name:document.getElementById('genName').value.trim(),fatherName:document.getElementById('genFather').value.trim(),nid:document.getElementById('genNid').value.trim(),mobile:document.getElementById('genMobile').value.trim(),wardNo:document.getElementById('genWard').value,village:document.getElementById('genVillage').value.trim(),postOffice:document.getElementById('genPost').value.trim()};callBackendAPI('submitApplication',d).then(function(r){b.disabled=false;if(r&&r.success){document.getElementById('successAppId').innerText=r.appId;document.getElementById('successAppCopyBtn').onclick=function(){printGeneralAppCopy(r.appId)};bootstrap.Modal.getOrCreateInstance(document.getElementById('successModal')).show();document.getElementById('generalAppPageForm').reset()}else alert((r&&(r.error||r.message))||'আবেদন জমা দেওয়া যায়নি।')})}
function generalBody(d){return 'এই মর্মে প্রত্যয়ন করা যাচ্ছে যে, <strong>'+escapeGeneral(d.name)+'</strong>, পিতা: <strong>'+escapeGeneral(d.fatherName)+'</strong>, জন্ম নিবন্ধন/ভোটার আইডি নম্বর: <strong>'+escapeGeneral(d.nid)+'</strong>, গ্রাম: <strong>'+escapeGeneral(d.village)+'</strong>, ডাকঘর: <strong>'+escapeGeneral(d.postOffice||'আউলিয়াপুর ময়দান')+'</strong>, ওয়ার্ড নং: <strong>'+escapeGeneral(d.wardNo)+'</strong>, '+GENERAL_UNION+', '+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'-এর একজন বাসিন্দা। '+escapeGeneral(GENERAL_TEMPLATES[d.type]||GENERAL_TEMPLATES['বিবিধ প্রত্যয়নপত্র'])}
function certificateMarkup(d){var logo='https://lh3.googleusercontent.com/d/1_LMOoAtirVZeGxE4sz_CVQtQpInPPQTs',chair=escapeGeneral(d.chairName||'অ্যাড. মোঃ হুমায়ুন কবির'),role=escapeGeneral(d.signatoryRole||'চেয়ারম্যান');return '<article class="official-certificate"><img class="cert-watermark" src="'+logo+'" alt=""><div class="cert-content"><header><img src="'+logo+'" alt="ইউনিয়ন পরিষদ লোগো"><div class="header-copy"><h1>'+GENERAL_UNION+' ইউনিয়ন পরিষদ</h1><div>ডাকঘর: আউলিয়াপুর ময়দান, '+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'</div><div>পটুয়াখালী জেলা</div></div><div class="seal-box">সিল /<br>ছবি</div></header><div class="rule"></div><div class="meta"><span>স্মারক নং- আ/ইউ/পটুয়া/সদর/'+generalCurrentYear()+'/'+escapeGeneral(generalApplicationNumber(d.appId))+'</span><span>তারিখ: '+generalPrintDate()+'</span></div><h2>'+escapeGeneral(d.type||'বিবিধ প্রত্যয়নপত্র')+'</h2><div class="certificate-body">'+generalBody(d)+'</div><div class="closing">আমি তাঁর সর্বাঙ্গীন উন্নতি ও মঙ্গল কামনা করি।</div><div class="certificate-signatures"><div class="chairman"><span class="signature-line"></span>'+chair+'<br>'+role+'<br><small>'+GENERAL_UNION+' পরিষদ<br>'+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'</small></div></div><footer><span>তথ্য যাচাই করুন</span><strong>সত্যের জয় হোক</strong><span>অফিসিয়াল প্রত্যয়নপত্র</span></footer></div></article>'}
function printGeneralCertificate(id){callBackendAPI('trackApplication',id).then(function(d){if(!d||!d.found)return alert('সনদের তথ্য পাওয়া যায়নি।');if(d.status!=='Approved')return alert('অনুমোদনের পর সনদ প্রিন্ট করা যাবে।');var host=document.getElementById('generalPrintHost');if(!host){host=document.createElement('div');host.id='generalPrintHost';document.body.appendChild(host)}host.innerHTML=certificateMarkup(d);document.body.classList.add('general-print-mode');var images=host.getElementsByTagName('img'),remaining=images.length,printed=false,finished=false;function cleanup(){if(finished)return;finished=true;document.body.classList.remove('general-print-mode');host.innerHTML='';window.onafterprint=null}function finishPrint(){if(printed)return;printed=true;window.print()}function readyToPrint(){if(document.fonts&&document.fonts.ready){document.fonts.ready.then(finishPrint)}else{finishPrint()}}function imageDone(){if(!--remaining)readyToPrint()}for(var i=0;i<images.length;i++){if(images[i].complete)remaining--;else{images[i].addEventListener('load',imageDone,{once:true});images[i].addEventListener('error',imageDone,{once:true})}}window.onafterprint=cleanup;if(!remaining)setTimeout(readyToPrint,300);setTimeout(readyToPrint,2500)})}

le>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Nikosh,"Noto Serif Bengali",serif}.paper{width:210mm;min-height:297mm;padding:25mm 25mm 20mm;font-size:18px;line-height:1.9}.heading{text-align:center;font-size:24px;text-decoration:underline;margin-bottom:20px}.date{text-align:right;margin-bottom:22px}.recipient{margin-bottom:18px}.subject{font-weight:bold;text-decoration:underline;margin:18px 0}.body{text-align:justify;text-indent:45px;min-height:105px}.closing{margin-top:22px}.details{border-top:1px solid #777;border-bottom:1px solid #777;padding:10px 0;margin-top:20px}.signature{margin-top:55px;margin-left:auto;width:210px;text-align:center}.signature-line{border-top:1px solid #111;margin-bottom:7px}.footer{margin-top:28px;font-size:14px;color:#444}@media print{.paper{min-height:297mm}}</style></head><body><main class="paper"><div class="heading">আবেদনপত্র</div><div class="date">তারিখ: '+escapeGeneral(d.date||d.applyDate||generalPrintDate())+'</div><div class="recipient">বরাবর<br>চেয়ারম্যান<br>'+GENERAL_UNION+' ইউনিয়ন পরিষদ<br>'+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'</div><div class="subject">বিষয়: '+escapeGeneral(subject)+'</div><p>জনাব,</p><div class="body">'+body+'</div><p class="closing">অতএব, মহোদয়ের নিকট বিনীত আবেদন, উপরোক্ত বিষয়টি সদয় বিবেচনা করে আমাকে প্রয়োজনীয় '+escapeGeneral(type)+' প্রদান করতে মর্জি হয়।</p>'+details+'<div class="signature"><div class="signature-line">স্বাক্ষর</div><strong>'+escapeGeneral(name)+'</strong><br>আবেদনকারী<br>মোবাইল: '+escapeGeneral(mobile)+'</div><div class="footer">আবেদনপত্রের ধরন: '+escapeGeneral(type)+' | ট্র্যাকিং আইডি: '+escapeGeneral(d.appId||id)+'</div></main></body></html>');w.document.close();w.focus();setTimeout(function(){w.print()},500)})}

<script>
