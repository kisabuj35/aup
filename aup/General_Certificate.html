<div class="modal fade" id="generalEditModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header bg-warning"><h5 class="modal-title fw-bold">সাধারণ প্রত্যয়ন তথ্য সংশোধন</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form onsubmit="event.preventDefault();saveEditedGeneralData()"><input type="hidden" id="editGenAppId"><div class="row g-3"><div class="col-md-6"><label class="form-label fw-bold">সেবার ধরন</label><input id="editGenType" class="form-control" readonly></div><div class="col-md-6"><label class="form-label fw-bold">নাম *</label><input id="editGenName" class="form-control" required></div><div class="col-md-6"><label class="form-label fw-bold">পিতার নাম *</label><input id="editGenFather" class="form-control" required></div><div class="col-md-6"><label class="form-label fw-bold">জন্ম নিবন্ধন / ভোটার আইডি *</label><input id="editGenNid" class="form-control" required></div><div class="col-md-4"><label class="form-label fw-bold">মোবাইল</label><input id="editGenMobile" class="form-control"></div><div class="col-md-4"><label class="form-label fw-bold">ওয়ার্ড</label><select id="editGenWard" class="form-select"><option>০১</option><option>০২</option><option>০৩</option><option>০৪</option><option>০৫</option><option>০৬</option><option>০৭</option><option>০৮</option><option>০৯</option></select></div><div class="col-md-4"><label class="form-label fw-bold">গ্রাম</label><input id="editGenVillage" class="form-control" required></div><div class="col-md-12"><label class="form-label fw-bold">ডাকঘর</label><input id="editGenPost" class="form-control" required></div></div><div class="text-end mt-4"><button class="btn btn-warning fw-bold" id="saveEditGenBtn">আপডেট করুন</button></div></form></div></div></div></div>
<script>
var GENERAL_UNION='১১নং আউলিয়াপুর ইউনিয়ন',GENERAL_UPAZILA='পটুয়াখালী সদর',GENERAL_DISTRICT='পটুয়াখালী';
var GENERAL_TEMPLATES={'চারিত্রিক সনদ':'তিনি সৎ, চরিত্রবান, শান্তিপ্রিয় ও আইনানুগ জীবনযাপনকারী নাগরিক। আমার জানামতে তিনি কোনো রাষ্ট্রবিরোধী বা সমাজবিরোধী কাজে জড়িত নন।','ভূমিহীন সনদ':'তাঁর নিজের কোনো বসতভিটা, কৃষিজমি বা স্থাবর সম্পত্তি নেই। তিনি প্রকৃত অর্থে একজন ভূমিহীন নাগরিক।','অবিবাহিত সনদ':'তিনি অদ্যাবধি কোনো বিবাহ বন্ধনে আবদ্ধ হননি এবং বর্তমানে অবিবাহিত আছেন।','বিবাহিত সনদ':'তিনি সামাজিক ও ধর্মীয় রীতি অনুযায়ী বিবাহিত এবং দাম্পত্য জীবনযাপন করছেন।','পুনঃ বিবাহ না হওয়া সনদ':'পূর্বের স্বামী/স্ত্রীর মৃত্যুর পর অদ্যাবধি তিনি দ্বিতীয় কোনো বিবাহ করেননি।','বার্ষিক আয়ের প্রত্যয়ন':'তাঁর পরিবারে বিভিন্ন উৎস থেকে বার্ষিক আনুমানিক আয় প্রায় ১,২০,০০০ টাকা।','মাসিক আয়ের সনদ':'তাঁর নিজস্ব ও পারিবারিক উৎস থেকে মাসিক আনুমানিক গড় আয় প্রায় ১০,০০০ টাকা।','আর্থিক অসচ্ছলতার সনদপত্র':'তাঁর পরিবারের আর্থিক অবস্থা নাজুক ও অসচ্ছল। তিনি সরকারি সহায়তা পাওয়ার উপযুক্ত।','প্রতিবন্ধী সনদপত্র':'তিনি প্রতিবন্ধকতায় ভুগছেন এবং স্বাভাবিক কাজকর্মে সহায়তা প্রয়োজন।','অনাপত্তি সনদপত্র':'তাঁর পাসপোর্ট, চাকরি বা বিদেশ গমনের বিষয়ে অত্র ইউনিয়ন পরিষদের কোনো আপত্তি নেই।','নতুন ভোটারের প্রত্যয়ন পত্র':'তিনি ১৮ বছর পূর্ণ করেছেন এবং ভোটার তালিকায় নাম অন্তর্ভুক্তির জন্য উপযুক্ত।','ভোটার স্থানান্তরের প্রত্যয়ন পত্র':'তিনি অত্র ইউনিয়নে বসবাস করায় ভোটার এলাকা স্থানান্তরে কোনো আপত্তি নেই।','বেকারত্বের সনদপত্র':'তিনি বর্তমানে কোনো চাকরিতে নিয়োজিত নন এবং একজন বেকার নাগরিক।','অস্থায়ীভাবে বসবাসের প্রত্যয়ন পত্র':'তিনি চাকরি বা ব্যবসার কারণে অত্র ইউনিয়নে অস্থায়ীভাবে বসবাস করছেন।','জাতীয়তা সনদ':'তিনি জন্মসূত্রে বাংলাদেশের নাগরিক এবং কোনো বিদেশি রাষ্ট্রের নাগরিকত্ব গ্রহণ করেননি।','স্থায়ী বাসিন্দা সনদ':'তিনি এবং তাঁর পূর্বপুরুষগণ বংশানুক্রমিকভাবে অত্র ইউনিয়নের স্থায়ী অধিবাসী।','এতিম সনদ':'শৈশবেই তাঁর পিতা মৃত্যুবরণ করেছেন এবং তিনি পিতৃহীন এতিম সন্তান।','একই নামের প্রত্যয়ন':'বিভিন্ন নথিতে নামের সামান্য পার্থক্য থাকলেও উভয় নাম একই ব্যক্তিকে নির্দেশ করে।','দ্বিতীয় বিবাহের অনুমতি পত্র':'প্রচলিত আইন ও পারিবারিক বিষয় বিবেচনায় তাঁর দ্বিতীয় বিবাহে অত্র ইউনিয়নের কোনো আপত্তি নেই।','বিবিধ প্রত্যয়নপত্র':'তিনি অত্র এলাকার একজন সৎ, শান্তিপ্রিয় ও আইনানুগ নাগরিক।'};
function escapeGeneral(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function generalBnDigits(v){return String(v==null?'':v).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
function generalApplicationNumber(appId){var value=String(appId==null?'':appId).replace(/^AUL[-/\s]*/i,'');var parts=value.split(/[-/\s]+/).filter(function(part){return part!==''});return generalBnDigits(parts.length?parts[parts.length-1]:value)}
function generalCurrentYear(){return generalBnDigits(new Date().getFullYear())}
function generalPrintDate(){return new Date().toLocaleDateString('bn-BD',{day:'2-digit',month:'2-digit',year:'numeric'})}
function openGeneralServicePage(type){navToSection('generalServiceView');document.getElementById('generalAppPageForm').reset();document.getElementById('genTypeHidden').value=type;document.getElementById('genServiceLabel').innerText=type;document.getElementById('genPageMainTitle').innerText=type+' আবেদন';document.getElementById('genPost').value='আউলিয়াপুর ময়দান'}
function submitGeneralAppForm(){var b=document.getElementById('genSubmitBtn');b.disabled=true;var d={type:document.getElementById('genTypeHidden').value,name:document.getElementById('genName').value.trim(),fatherName:document.getElementById('genFather').value.trim(),nid:document.getElementById('genNid').value.trim(),mobile:document.getElementById('genMobile').value.trim(),wardNo:document.getElementById('genWard').value,village:document.getElementById('genVillage').value.trim(),postOffice:document.getElementById('genPost').value.trim()};callBackendAPI('submitApplication',d).then(function(r){b.disabled=false;if(r&&r.success){document.getElementById('successAppId').innerText=r.appId;document.getElementById('successAppCopyBtn').onclick=function(){printGeneralAppCopy(r.appId)};bootstrap.Modal.getOrCreateInstance(document.getElementById('successModal')).show();document.getElementById('generalAppPageForm').reset()}else alert((r&&(r.error||r.message))||'আবেদন জমা দেওয়া যায়নি।')})}
function generalBody(d){return 'এই মর্মে প্রত্যয়ন করা যাচ্ছে যে, <strong>'+escapeGeneral(d.name)+'</strong>, পিতা: <strong>'+escapeGeneral(d.fatherName)+'</strong>, জন্ম নিবন্ধন/ভোটার আইডি নম্বর: <strong>'+escapeGeneral(d.nid)+'</strong>, গ্রাম: <strong>'+escapeGeneral(d.village)+'</strong>, ডাকঘর: <strong>'+escapeGeneral(d.postOffice||'আউলিয়াপুর ময়দান')+'</strong>, ওয়ার্ড নং: <strong>'+escapeGeneral(d.wardNo)+'</strong>, '+GENERAL_UNION+', '+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'-এর একজন বাসিন্দা। '+escapeGeneral(GENERAL_TEMPLATES[d.type]||GENERAL_TEMPLATES['বিবিধ প্রত্যয়নপত্র'])}
function certificateMarkup(d){var logo='https://lh3.googleusercontent.com/d/1_LMOoAtirVZeGxE4sz_CVQtQpInPPQTs',chair=escapeGeneral(d.chairName||'অ্যাড. মোঃ হুমায়ুন কবির'),role=escapeGeneral(d.signatoryRole||'চেয়ারম্যান');return '<article class="official-certificate"><img class="cert-watermark" src="'+logo+'" alt=""><div class="cert-content"><header><img src="'+logo+'" alt="ইউনিয়ন পরিষদ লোগো"><div class="header-copy"><h1>'+GENERAL_UNION+' ইউনিয়ন পরিষদ</h1><div>ডাকঘর: আউলিয়াপুর ময়দান, '+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'</div><div>পটুয়াখালী জেলা</div></div><div class="seal-box">সিল /<br>ছবি</div></header><div class="rule"></div><div class="meta"><span>স্মারক নং- আ/ইউ/পটুয়া/সদর/'+generalCurrentYear()+'/'+escapeGeneral(generalApplicationNumber(d.appId))+'</span><span>তারিখ: '+generalPrintDate()+'</span></div><h2>'+escapeGeneral(d.type||'বিবিধ প্রত্যয়নপত্র')+'</h2><div class="certificate-body">'+generalBody(d)+'</div><div class="closing">আমি তাঁর সর্বাঙ্গীন উন্নতি ও মঙ্গল কামনা করি।</div><div class="certificate-signatures"><div class="chairman"><span class="signature-line"></span>'+chair+'<br>'+role+'<br><small>'+GENERAL_UNION+' পরিষদ<br>'+GENERAL_UPAZILA+', '+GENERAL_DISTRICT+'</small></div></div><footer><span>তথ্য যাচাই করুন</span><strong>সত্যের জয় হোক</strong><span>অফিসিয়াল প্রত্যয়নপত্র</span></footer></div></article>'}
function printGeneralCertificate(id){callBackendAPI('trackApplication',id).then(function(d){if(!d||!d.found)return alert('সনদের তথ্য পাওয়া যায়নি।');if(d.status!=='Approved')return alert('অনুমোদনের পর সনদ প্রিন্ট করা যাবে।');var host=document.getElementById('generalPrintHost');if(!host){host=document.createElement('div');host.id='generalPrintHost';document.body.appendChild(host)}host.innerHTML=certificateMarkup(d);document.body.classList.add('general-print-mode');var images=host.getElementsByTagName('img'),remaining=images.length,printed=false,finished=false;function cleanup(){if(finished)return;finished=true;document.body.classList.remove('general-print-mode');host.innerHTML='';window.onafterprint=null}function finishPrint(){if(printed)return;printed=true;window.print()}function readyToPrint(){if(document.fonts&&document.fonts.ready){document.fonts.ready.then(finishPrint)}else{finishPrint()}}function imageDone(){if(!--remaining)readyToPrint()}for(var i=0;i<images.length;i++){if(images[i].complete)remaining--;else{images[i].addEventListener('load',imageDone,{once:true});images[i].addEventListener('error',imageDone,{once:true})}}window.onafterprint=cleanup;if(!remaining)setTimeout(readyToPrint,300);setTimeout(readyToPrint,2500)})}
function printGeneralElement(id){var w=window.open('','_blank'),css=document.getElementById('generalCertificateStyles').innerHTML;w.document.write('<html><head><title>প্রত্যয়নপত্র</title><link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet"><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{margin:0;padding:0;overflow:hidden}'+css+'</style></head><body>'+document.getElementById(id).innerHTML+'</body></html>');w.document.close();w.focus();w.print()}
function printGeneralAppCopy(id){callBackendAPI('trackApplication',id).then(function(d){if(!d||!d.found)return alert('আবেদনের তথ্য পাওয়া যায়নি।');var w=window.open('','_blank');w.document.write('<html><head><title>আবেদন কপি</title><link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet"></head><body style="font-family:Nikosh;font-size:18px;padding:25px"><h2>'+escapeGeneral(d.type)+' - আবেদন কপি</h2><p>নাম: '+escapeGeneral(d.name)+'<br>পিতা: '+escapeGeneral(d.fatherName)+'<br>আইডি: '+escapeGeneral(d.nid)+'<br>গ্রাম: '+escapeGeneral(d.village)+'<br>ওয়ার্ড: '+escapeGeneral(d.wardNo)+'<br>ডাকঘর: '+escapeGeneral(d.postOffice)+'<br>ট্র্যাকিং আইডি: '+escapeGeneral(d.appId)+'</p></body></html>');w.document.close();w.focus();w.print()})}
function openEditGeneralModal(id){callBackendAPI('trackApplication',id).then(function(d){if(!d||!d.found)return alert('আবেদনের তথ্য পাওয়া যায়নি।');[['editGenAppId','appId'],['editGenType','type'],['editGenName','name'],['editGenFather','fatherName'],['editGenNid','nid'],['editGenMobile','mobile'],['editGenWard','wardNo'],['editGenVillage','village'],['editGenPost','postOffice']].forEach(function(x){document.getElementById(x[0]).value=d[x[1]]||''});bootstrap.Modal.getOrCreateInstance(document.getElementById('generalEditModal')).show()})}
function saveEditedGeneralData(){var b=document.getElementById('saveEditGenBtn'),d={appId:document.getElementById('editGenAppId').value,type:document.getElementById('editGenType').value,name:document.getElementById('editGenName').value.trim(),fatherName:document.getElementById('editGenFather').value.trim(),nid:document.getElementById('editGenNid').value.trim(),mobile:document.getElementById('editGenMobile').value.trim(),wardNo:document.getElementById('editGenWard').value,village:document.getElementById('editGenVillage').value.trim(),postOffice:document.getElementById('editGenPost').value.trim()};b.disabled=true;callBackendAPI('saveEditedApplication',d).then(function(r){b.disabled=false;if(r&&r.success){bootstrap.Modal.getInstance(document.getElementById('generalEditModal')).hide();loadAdminApps();Swal.fire({icon:'success',title:'তথ্য আপডেট হয়েছে',timer:1400,showConfirmButton:false})}else alert('তথ্য আপডেট করা যায়নি।')})}
</script>
<script>
(function(){
	function addMotherField(formId, anchorId, fieldId){
		var form=document.getElementById(formId),anchor=document.getElementById(anchorId);
		if(!form||!anchor||document.getElementById(fieldId))return;
		var wrap=document.createElement('div');wrap.className='col-md-6';wrap.innerHTML='<label class="form-label fw-bold">মাতার নাম *</label><input id="'+fieldId+'" class="form-control" required>';
		anchor.parentNode.insertBefore(wrap,anchor.nextSibling);
	}
	function ensureGeneralMotherFields(){
		addMotherField('generalAppPageForm','genFather','genMother');
		addMotherField('generalEditModal','editGenFather','editGenMother');
	}
	var originalOpenGeneralServicePage=window.openGeneralServicePage;
	window.openGeneralServicePage=function(type){originalOpenGeneralServicePage(type);ensureGeneralMotherFields()};
	var originalSubmitGeneralAppForm=window.submitGeneralAppForm;
	window.submitGeneralAppForm=function(){
		ensureGeneralMotherFields();var button=document.getElementById('genSubmitBtn');button.disabled=true;
		var data={type:document.getElementById('genTypeHidden').value,name:document.getElementById('genName').value.trim(),fatherName:document.getElementById('genFather').value.trim(),motherName:document.getElementById('genMother').value.trim(),nid:document.getElementById('genNid').value.trim(),mobile:document.getElementById('genMobile').value.trim(),wardNo:document.getElementById('genWard').value,village:document.getElementById('genVillage').value.trim(),postOffice:document.getElementById('genPost').value.trim()};
		callBackendAPI('submitApplication',data).then(function(result){button.disabled=false;if(result&&result.success){document.getElementById('successAppId').innerText=result.appId;document.getElementById('successAppCopyBtn').onclick=function(){printGeneralAppCopy(result.appId)};bootstrap.Modal.getOrCreateInstance(document.getElementById('successModal')).show();document.getElementById('generalAppPageForm').reset()}else alert((result&&(result.error||result.message))||'আবেদন জমা দেওয়া যায়নি।')});
	};
	var originalOpenEditGeneralModal=window.openEditGeneralModal;
	window.openEditGeneralModal=function(id){
		ensureGeneralMotherFields();originalOpenEditGeneralModal(id);
		setTimeout(function(){ensureGeneralMotherFields();callBackendAPI('trackApplication',id).then(function(data){if(data&&data.found&&document.getElementById('editGenMother'))document.getElementById('editGenMother').value=data.motherName||''})},100);
	};
	var originalSaveEditedGeneralData=window.saveEditedGeneralData;
	window.saveEditedGeneralData=function(){
		ensureGeneralMotherFields();var button=document.getElementById('saveEditGenBtn'),data={appId:document.getElementById('editGenAppId').value,type:document.getElementById('editGenType').value,name:document.getElementById('editGenName').value.trim(),fatherName:document.getElementById('editGenFather').value.trim(),motherName:document.getElementById('editGenMother').value.trim(),nid:document.getElementById('editGenNid').value.trim(),mobile:document.getElementById('editGenMobile').value.trim(),wardNo:document.getElementById('editGenWard').value,village:document.getElementById('editGenVillage').value.trim(),postOffice:document.getElementById('editGenPost').value.trim()};button.disabled=true;callBackendAPI('saveEditedApplication',data).then(function(result){button.disabled=false;if(result&&result.success){bootstrap.Modal.getInstance(document.getElementById('generalEditModal')).hide();loadAdminApps();Swal.fire({icon:'success',title:'তথ্য আপডেট হয়েছে',timer:1400,showConfirmButton:false})}else alert('তথ্য আপডেট করা যায়নি।')});
	};
	var originalGeneralBody=window.generalBody;
	window.generalBody=function(data){return originalGeneralBody(data).replace('জন্ম নিবন্ধন/ভোটার আইডি নম্বর:','মাতা: <strong>'+escapeGeneral(data.motherName||'')+'</strong>, জন্ম নিবন্ধন/ভোটার আইডি নম্বর:')};
})();
</script>
