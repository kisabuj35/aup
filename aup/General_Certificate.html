  function escapeGeneral(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }

  function generalBnDigits(v) {
    if (v === null || v === undefined || v === '') return '';
    return String(v).replace(/\d/g, function(d) { return '০১২৩৪৫৬৭৮৯'[d]; });
  }

  function generalApplicationNumber(appId) {
    var value = String(appId == null ? '' : appId).replace(/^AUL[-/\s]*/i, '');
    var parts = value.split(/[-/\s]+/).filter(function(part) { return part !== ''; });
    return generalBnDigits(parts.length ? parts[parts.length - 1] : value);
  }

  function generalCurrentYear() {
    return generalBnDigits(new Date().getFullYear());
  }

  function generalPrintDate() {
    var months = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
    var now = new Date();
    return generalBnDigits(now.getDate()) + ' ' + months[now.getMonth()] + ' ' + generalBnDigits(now.getFullYear());
  }

  /* 🟢 স্মার্ট ডাটা ফেচার (মেমোরি ও এপিআই উভয়েই ১০০% কাজ করবে) */
  async function fetchGeneralCertificateData(id) {
    if (!id) return null;
    var cleanId = String(id).trim().toUpperCase();
    var d = null;

    if (typeof rawDataStore !== 'undefined' && Array.isArray(rawDataStore.gen)) {
      d = rawDataStore.gen.find(function(x) {
        return String(x.appId || x.id || '').trim().toUpperCase() === cleanId;
      });
    }

    if (!d && typeof callBackendAPI === 'function') {
      try {
        var res = await callBackendAPI('trackApplication', cleanId);
        if (res && (res.found || res.appId || res.name || res.applicantName)) {
          d = res;
        }
      } catch(e) { console.warn("API tracking error:", e); }
    }
    return d;
  }

  function openGeneralServicePage(type) {
    navToSection('generalServiceView');
    var form = document.getElementById('generalAppPageForm');
    if (form) form.reset();
    document.getElementById('genTypeHidden').value = type;
    document.getElementById('genServiceLabel').innerText = type;
    document.getElementById('genPageMainTitle').innerText = type + ' আবেদন ফরম';
    document.getElementById('genPost').value = 'আউলিয়াপুর ময়দান';
  }

  async function submitGeneralAppForm() {
    var btn = document.getElementById('genSubmitBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i> জমা হচ্ছে...';

    var data = {
      type: document.getElementById('genTypeHidden').value,
      name: document.getElementById('genName').value.trim(),
      fatherName: document.getElementById('genFather').value.trim(),
      motherName: document.getElementById('genMother').value.trim(),
      nid: document.getElementById('genNid').value.trim(),
      mobile: document.getElementById('genMobile').value.trim(),
      wardNo: document.getElementById('genWard').value,
      village: document.getElementById('genVillage').value.trim(),
      postOffice: document.getElementById('genPost').value.trim()
    };

    var res = await callBackendAPI('submitApplication', data);
    btn.disabled = false; btn.innerHTML = '<i class="fa fa-paper-plane me-1"></i> আবেদন জমা দিন';

    if (res && res.success) {
      document.getElementById('successAppId').innerText = res.appId;
      document.getElementById('successAppCopyBtn').onclick = function() { printGeneralAppCopy(res.appId); };
      bootstrap.Modal.getOrCreateInstance(document.getElementById('successModal')).show();
      document.getElementById('generalAppPageForm').reset();
    } else {
      Swal.fire({ icon: 'error', title: 'ব্যর্থ', text: (res && (res.error || res.message)) || 'আবেদন জমা দেওয়া যায়নি।' });
    }
  }

  /* 🟢 বর্ধিত বিবরণী বিল্ডার */
  function generalBody(d) {
    var certType = d.type || d.serviceType || 'বিবিধ প্রত্যয়নপত্র';
    var specificText = GENERAL_TEMPLATES[certType] || GENERAL_TEMPLATES['বিবিধ প্রত্যয়নপত্র'];
    var fatherVal = d.fatherName || d.father || d.fatherSpouseName || '';
    var motherVal = d.motherName || d.mother || '';
    
    var basicInfo = 'এই মর্মে প্রত্যয়ন পত্র প্রদান করা যাইতেছে যে, <strong>' + escapeGeneral(d.name || d.applicantName) + '</strong>, পিতা- <strong>' + escapeGeneral(fatherVal) + '</strong>, মাতা- <strong>' + escapeGeneral(motherVal) + '</strong>, গ্রাম- <strong>' + escapeGeneral(d.village) + '</strong>, ডাকঘর- <strong>' + escapeGeneral(d.postOffice || 'আউলিয়াপুর ময়দান') + '</strong>, ওয়ার্ড নং- <strong>' + generalBnDigits(d.wardNo) + '</strong>, ইউনিয়ন- <strong>' + GENERAL_UNION + '</strong>, উপজেলা- <strong>' + GENERAL_UPAZILA + '</strong>, জেলা- <strong>' + GENERAL_DISTRICT + '</strong>।<br><br>তাঁহার জাতীয় পরিচয়পত্র / জন্ম নিবন্ধন নম্বর: <strong>' + generalBnDigits(d.nid) + '</strong>। তিনি অত্র ইউনিয়নের একজন স্থায়ী বাসিন্দা। ';
    return basicInfo + specificText;
  }

  /* 🟢 অফিসিয়াল A4 সনদ মার্কআপ জেনারেটর */
  function certificateMarkup(d) {
    var chairName = escapeGeneral(d.chairName || 'অ্যাড. মোঃ হুমায়ুন কবির');
    var roleName = escapeGeneral(d.signatoryRole || 'চেয়ারম্যান');
    var certTitle = escapeGeneral(d.type || d.serviceType || 'প্রত্যয়নপত্র');
    if (!certTitle.endsWith('সনদ') && !certTitle.endsWith('পত্র')) certTitle += ' পত্র';

    var smarakNo = 'আ/ইউ/পটুয়া/সদর/' + generalCurrentYear() + '/' + escapeGeneral(generalApplicationNumber(d.appId));
    var liveDate = generalPrintDate();

    return `

            <header>
              <div class="logo-left">
                <img src="${PRIMARY_UP_LOGO}" onerror="if(this.src!=='${FALLBACK_UP_LOGO}'){this.src='${FALLBACK_UP_LOGO}';}else{this.src='${STATIC_GOVT_LOGO}';}" alt="UP Logo">
              </div>
              <div class="header-copy">
                <div class="govt-sub">গণপ্রজাতন্ত্রী বাংলাদেশ সরকার (স্থানীয় সরকার বিভাগ)</div>
                <h1>${GENERAL_UNION} পরিষদ কার্যালয়</h1>
                <div class="up-address">ডাকঘরঃ আউলিয়াপুর ময়দান, উপজেলা ও জেলাঃ পটুয়াখালী ।</div>

            <div class="meta-bar">

            <!-- ৩ডি রিবন ব্যানার -->
            <div class="ribbon-wrapper-main">
              <div class="ribbon-green-box">

                ${certTitle}
                <div class="ribbon-wing-r"></div>

            <!-- মূল বিবরণী: ১৯.৫px ফন্ট সাইজ ও ২.৩ লাইন-হাইট -->
            <div class="certificate-body">
              ${generalBody(d)}

            <div class="closing">

          <!-- 🟢 ডানে নিচে শুধু চেয়ারম্যানের একক স্বাক্ষর ব্লক -->
          <div>
            <div class="certificate-signatures-single">

              <div class="cert-bottom-qr-box">

  /* 🟢 ১-ক্লিক ডিরেক্ট আইফ্রেম প্রিন্ট ইঞ্জিন (শতভাগ নিশ্চিত কাজ করবে) */
  async function showGeneralCertPrintPreview(id) {
    let d = await fetchGeneralCertificateData(id);
    if (!d) return alert('সনদের তথ্য পাওয়া যায়নি।');

    var certHtml = certificateMarkup(d);
    var oldFrame = document.getElementById('gen_direct_print_frame');
    if (oldFrame) oldFrame.remove();

    var iframe = document.createElement('iframe');
    iframe.id = 'gen_direct_print_frame';
    iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:210mm;height:297mm;border:0;';
    document.body.appendChild(iframe);

    var doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>Certificate - ${escapeGeneral(d.appId || id)}</title>
        <link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Tiro+Bangla&display=swap" rel="stylesheet">
        <style>
          @page { size: A4 portrait; margin: 0mm !important; }
          * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
          body { margin: 0 !important; padding: 0 !important; background: #ffffff !important; font-family: 'Nikosh', 'Kalpurush', sans-serif !important; }
          ${document.getElementById('generalCertificateStyles').innerHTML}
        </style>
      </head>
      <body>${certHtml}</body>
      </html>
    `);
    doc.close();

    // 🟢 নিশ্চিত ও শক্তিশালী প্রিন্ট ট্রিগার
    var images = Array.prototype.slice.call(doc.getElementsByTagName('img'));
    var remaining = images.length;
    var printed = false;

    function doPrint() {
      if (printed) return;
      printed = true;
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch(e) { console.error('Print error:', e); }
    }

    if (remaining === 0) {
      setTimeout(doPrint, 200);
    } else {
      var fallbackTimer = setTimeout(doPrint, 1200);
      images.forEach(function(img) {
        if (img.complete && img.naturalWidth > 0) {
          remaining--;
          if (remaining === 0) {
            clearTimeout(fallbackTimer);
            setTimeout(doPrint, 100);
          }
        } else {
          img.onload = img.onerror = function() {
            remaining--;
            if (remaining === 0) {
              clearTimeout(fallbackTimer);
              setTimeout(doPrint, 100);
            }
          };
        }
      });
    }
  }

  function printGeneralCertificate(id) {
    showGeneralCertPrintPreview(id);
  }

  function printGeneralElement(id) {
    showGeneralCertPrintPreview(id);
  }

  async function printGeneralAppCopy(id) {
    var d = await fetchGeneralCertificateData(id);
    if (!d) return alert('আবেদনের তথ্য পাওয়া যায়নি।');

    var type = d.type || d.serviceType || 'সাধারণ প্রত্যয়ন';
    var name = d.name || d.applicantName || '';
    var mobile = d.mobile || d.phone || '-';
    var father = d.fatherName || d.father || '-';
    var mother = d.motherName || d.mother || '-';
    var nid = d.nid || d.nidNo || '-';
    var address = [d.village, d.postOffice, d.wardNo ? 'ওয়ার্ড নং ' + d.wardNo : ''].filter(Boolean).join(', ') || '-';
    var subject = type + ' প্রাপ্তির জন্য আবেদন।';
    var body = 'আমি ' + escapeGeneral(name) + ', পিতা: ' + escapeGeneral(father) + ', মাতা: ' + escapeGeneral(mother) + ', ' + escapeGeneral(address) + '-এর একজন স্থায়ী বাসিন্দা। আমার প্রয়োজনীয় কাজের জন্য আমাকে ' + escapeGeneral(type) + ' প্রদান করার জন্য বিনীতভাবে আবেদন করছি।';

    var details = '<p><strong>আবেদনকারীর নাম:</strong> ' + escapeGeneral(name) + '<br><strong>পিতার নাম:</strong> ' + escapeGeneral(father) + '<br><strong>মাতার নাম:</strong> ' + escapeGeneral(mother) + '<br><strong>জাতীয় পরিচয়পত্র/জন্ম নিবন্ধন:</strong> ' + generalBnDigits(nid) + '<br><strong>মোবাইল নম্বর:</strong> ' + generalBnDigits(mobile) + '<br><strong>ট্র্যাকিং আইডি:</strong> ' + escapeGeneral(d.appId || id) + '</p>';

    var w = window.open('', '_blank');
    if (!w) return alert('প্রিন্ট উইন্ডো খোলা যায়নি।');
    w.document.write('<html lang="bn"><head><meta charset="UTF-8"><title>আবেদনপত্র - ' + escapeGeneral(type) + '</title><link href="https://fonts.maateen.me/nikosh/font.css" rel="stylesheet"><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Nikosh,"Noto Serif Bengali",serif}.paper{width:210mm;min-height:297mm;padding:25mm 25mm 20mm;font-size:18px;line-height:1.9}.heading{text-align:center;font-size:24px;text-decoration:underline;margin-bottom:20px}.date{text-align:right;margin-bottom:22px}.recipient{margin-bottom:18px}.subject{font-weight:bold;text-decoration:underline;margin:18px 0}.body{text-align:justify;text-indent:45px;min-height:105px}.closing{margin-top:22px}.details{border-top:1px solid #777;border-bottom:1px solid #777;padding:10px 0;margin-top:20px}.signature{margin-top:55px;margin-left:auto;width:210px;text-align:center}.signature-line{border-top:1px solid #111;margin-bottom:7px}.footer{margin-top:28px;font-size:14px;color:#444}@media print{.paper{min-height:297mm}}</style></head><body><main class="paper"><div class="heading">আবেদনপত্র</div><div class="date">তারিখ: ' + escapeGeneral(d.date || d.applyDate || generalPrintDate()) + '</div><div class="recipient">বরাবর<br>চেয়ারম্যান<br>' + GENERAL_UNION + ' পরিষদ<br>' + GENERAL_UPAZILA + ', ' + GENERAL_DISTRICT + '</div><div class="subject">বিষয়: ' + escapeGeneral(subject) + '</div><p>জনাব,</p><div class="body">' + body + '</div><p class="closing">অতএব, মহোদয়ের নিকট বিনীত আবেদন, উপরোক্ত বিষয়টি সদয় বিবেচনা করে আমাকে প্রয়োজনীয় ' + escapeGeneral(type) + ' প্রদান করতে মর্জি হয়।</p>' + details + '<div class="signature"><div class="signature-line">স্বাক্ষর</div><strong>' + escapeGeneral(name) + '</strong><br>আবেদনকারী<br>মোবাইল: ' + generalBnDigits(mobile) + '</div><div class="footer">আবেদনপত্রের ধরন: ' + escapeGeneral(type) + ' | ট্র্যাকিং আইডি: ' + escapeGeneral(d.appId || id) + '</div></main></body></html>');
    w.document.close();
    w.focus();
    setTimeout(function() { w.print(); }, 400);
  }

  /* 🟢 এডিট মোডাল ওপেনার (অ্যাডমিনের জন্য শতভাগ কাজ করবে) */
  async function openEditGeneralModal(id) {
    let d = await fetchGeneralCertificateData(id);
    if (!d) return alert('আবেদনের তথ্য পাওয়া যায়নি।');

    var setVal = function(ids, val) {
      ids.forEach(function(i) {
        var el = document.getElementById(i);
        if (el) el.value = val || '';
      });
    };

    setVal(['editGenAppId', 'edGenAppId'], d.appId || id);
    setVal(['editGenType', 'edGenType'], d.type || d.serviceType || 'প্রত্যয়নপত্র');
    setVal(['editGenName', 'edGenName'], d.name || d.applicantName || '');
    setVal(['editGenFather', 'edGenFather'], d.fatherName || d.father || d.fatherSpouseName || '');
    setVal(['editGenMother', 'edGenMother'], d.motherName || d.mother || '');
    setVal(['editGenNid', 'edGenNid'], d.nid || '');
    setVal(['editGenMobile', 'edGenMobile'], d.mobile || d.phone || '');
    setVal(['editGenWard', 'edGenWard'], d.wardNo || '০১');
    setVal(['editGenVillage', 'edGenVillage'], d.village || '');
    setVal(['editGenPost', 'edGenPost'], d.postOffice || 'আউলিয়াপুর ময়দান');

    var modalEl = document.getElementById('generalEditModal') || document.getElementById('editGeneralModal');
    if (modalEl) {
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    }
  }

  /* 🟢 এডিট ডাটা সেভ হ্যান্ডলার */
  async function saveEditedGeneralData() {
    var btn = document.getElementById('saveEditGenBtn') || document.getElementById('saveEditGenBtnAlt');
    if (btn) { btn.disabled = true; btn.innerText = 'আপডেট হচ্ছে...'; }

    var getVal = function(ids) {
      for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        if (el && el.value !== undefined && el.value !== '') return el.value.trim();
      }
      return '';
    };

    var payload = {
      appId: getVal(['editGenAppId', 'edGenAppId']),
      type: getVal(['editGenType', 'edGenType']),
      name: getVal(['editGenName', 'edGenName']),
      fatherName: getVal(['editGenFather', 'edGenFather']),
      motherName: getVal(['editGenMother', 'edGenMother']),
      nid: getVal(['editGenNid', 'edGenNid']),
      mobile: getVal(['editGenMobile', 'edGenMobile']),
      wardNo: getVal(['editGenWard', 'edGenWard']) || '০১',
      village: getVal(['editGenVillage', 'edGenVillage']),
      postOffice: getVal(['editGenPost', 'edGenPost']) || 'আউলিয়াপুর ময়দান'
    };

    var res = await callBackendAPI('saveEditedApplication', payload);
    if (btn) { btn.disabled = false; btn.innerText = 'আপডেট করুন'; }

    if (res && res.success) {
      var modalEl = document.getElementById('generalEditModal') || document.getElementById('editGeneralModal');
      if (modalEl) {
        var modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
      }
      if (typeof loadAdminApps === 'function') loadAdminApps();
      Swal.fire({ icon: 'success', title: 'তথ্য আপডেট হয়েছে', timer: 1500, showConfirmButton: false });
    } else {
      Swal.fire({ icon: 'error', title: 'ব্যর্থ', text: 'তথ্য আপডেট করা যায়নি।' });
    }
  }
</script>
